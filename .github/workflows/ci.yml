name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pest:
    name: PHP Tests (Pest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: floz_test
          POSTGRES_USER: floz
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U floz"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, redis, gd, intl, pcntl, bcmath, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: composer-${{ hashFiles('src/composer.lock') }}

      - name: Install Composer dependencies
        working-directory: src
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy test environment
        working-directory: src
        run: |
          cp .env.testing .env
          php artisan key:generate

      - name: Run Pest tests
        working-directory: src
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: floz_test
          DB_USERNAME: floz
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
        run: php artisan test --no-coverage

  npm-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install npm dependencies
        working-directory: src
        run: npm ci

      - name: Build frontend assets
        working-directory: src
        run: npm run build

  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory — does not block merge

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: floz_mobile
        run: flutter pub get

      - name: Run Flutter analyze
        working-directory: floz_mobile
        run: flutter analyze --no-fatal-infos
